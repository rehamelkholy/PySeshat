[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyseshat"
version = "0.2.0"
description = "Python framework for binary star orbit determination and stellar modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Reham El-Kholy", email = "relkholy@sci.cu.edu.eg" }
]
keywords = [
    "astronomy",
    "astrophysics",
    "binary stars",
    "orbit determination",
    "stellar modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "pandas",
    "emcee",
    "corner",
    "adjustText"
]

[project.urls]
Homepage = "https://github.com/rehamelkholy/PySeshat"
Repository = "https://github.com/rehamelkholy/PySeshat"
Issues = "https://github.com/rehamelkholy/PySeshat/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyseshat.photometry" = ["data/*.fits", "data/README.md"]
"pyseshat.evolution" = ["data/girardi2000/*.tsv", "data/girardi2000/README.md"]
