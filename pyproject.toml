[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyseshat"
version = "0.1.0"
description = "Python framework for binary star orbit determination and stellar modeling"
authors = [
    { name = "Reham El-Kholy", email = "relkholy@sci.cu.edu.eg" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "matplotlib",
    "pandas",
    "emcee",
    "corner",
    "numba",
    "astroquery"
]

[tool.setuptools.packages.find]
where = ["src"]